[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bruno-assistant"
version = "0.1.0"
description = "Bruno AI - Self-hosted personal AI assistant for phone, tablet, and desktop via Tailscale"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "websockets>=13",
  "beautifulsoup4>=4.12",
  "pydantic>=2.9",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
browser = ["playwright>=1.48"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
